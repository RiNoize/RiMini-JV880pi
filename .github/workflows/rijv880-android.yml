name: RiJV880 Android Test
on:
  push:
    branches: [android-virtualjv-test]
    paths: ['AndroidJV/**', '.github/workflows/rijv880-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rijv880-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-android
      CCACHE_MAXSIZE: 800M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned VirtualJV source (no ROMs)
        uses: actions/checkout@v4
        with:
          repository: giulioz/jv880_juce
          ref: bc141fc8b7a5039e909807e85ff1070d5727584b
          path: .deps/virtualjv
      - name: Source provenance snapshot
        run: |
          mkdir -p out
          git -C .deps/virtualjv rev-parse HEAD > out/virtualjv-commit.txt
          git -C .deps/virtualjv archive --format=zip --output="$GITHUB_WORKSPACE/out/VirtualJV-upstream.zip" HEAD
          git archive --format=zip --output="$GITHUB_WORKSPACE/out/AndroidJV-source.zip" HEAD AndroidJV .github/workflows/rijv880-android.yml
      - uses: actions/upload-artifact@v4
        with:
          name: virtualjv-upstream-snapshot
          path: out/
          retention-days: 7
      - name: Set up compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - uses: actions/cache/restore@v4
        with:
          path: .ccache-android
          key: rijv880-ndk28-juce8015-${{ github.sha }}
          restore-keys: rijv880-ndk28-juce8015-
      - name: Compile and verify ARM64 Android application
        shell: bash
        run: |
          set -o pipefail
          python3 -m py_compile AndroidJV/*.py
          python3 AndroidJV/build.py --sdk "$ANDROID_HOME" --upstream "$GITHUB_WORKSPACE/.deps/virtualjv" --jobs 4 2>&1 | tee build-android.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache-android
          key: rijv880-ndk28-juce8015-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: build-android.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ success() && hashFiles('AndroidJV/dist/*.apk') != '' }}
        with:
          name: RiJV880-AndroidTest-arm64
          path: AndroidJV/dist/
          retention-days: 30
