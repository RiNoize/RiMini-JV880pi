name: RiJV880 Android Test
on:
  push:
    branches: [android-virtualjv-test]
    paths: ['AndroidJV/**', '.github/workflows/rijv880-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rijv880-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-android
      CCACHE_MAXSIZE: 800M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned VirtualJV source (no ROMs)
        uses: actions/checkout@v4
        with:
          repository: giulioz/jv880_juce
          ref: bc141fc8b7a5039e909807e85ff1070d5727584b
          path: .deps/virtualjv
      - name: Recover previous local test signing key
        uses: actions/download-artifact@v4
        with:
          name: RiJV880-AndroidTest-arm64
          run-id: 37133099836
          github-token: ${{ github.token }}
          path: .previous-build
      - name: Preserve signing and apply browser safety revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          z=ZipFile('.previous-build/RiJV880-AndroidTest-v0.1.0-fuentes.zip')
          p=Path('AndroidJV/signing/local-test.keystore')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(z.read('RiJV880/AndroidJV/signing/local-test.keystore'))
          PY
          python3 AndroidJV/startup_fix.py
          python3 AndroidJV/import_fix.py
          python3 AndroidJV/eof_fix.py
          python3 AndroidJV/native_uri_fix.py
          python3 AndroidJV/audio_fix.py
          python3 AndroidJV/patch_change_fix.py
          python3 AndroidJV/browser_fix.py
          python3 -m py_compile AndroidJV/*.py
      - name: Audio continuity and LCD transfer tests (synthetic, host ASan/UBSan)
        run: |
          set -o pipefail
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -pthread AndroidJV/test_audio.cpp -o test-audio
          ./test-audio | tee audio-unit-tests.txt
      - name: Set up compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - uses: actions/cache/restore@v4
        with:
          path: .ccache-android
          key: rijv880-ndk28-juce8015-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: |
            rijv880-ndk28-juce8015-${{ matrix.abi }}-
            rijv880-ndk28-juce8015-
      - name: Compile and verify Android application
        shell: bash
        run: |
          set -o pipefail
          python3 AndroidJV/build.py --sdk "$ANDROID_HOME" --upstream "$GITHUB_WORKSPACE/.deps/virtualjv" --abi '${{ matrix.abi }}' --jobs 4 2>&1 | tee build-android.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs .previous-build/RiJV880-AndroidTest-v0.1.0-arm64.apk > previous-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs AndroidJV/dist/*.apk > current-cert.txt
          diff <(grep 'certificate SHA-256 digest' previous-cert.txt) <(grep 'certificate SHA-256 digest' current-cert.txt)
          cp AndroidJV/generated/virtualjv/BROWSER-SAFETY-SCOPE.json AndroidJV/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: RiJV880-AndroidTest-${{ matrix.abi }}
          path: AndroidJV/dist/
          retention-days: 30
      - name: Real JUCE browser memory-safety regression (synthetic catalogue, no firmware)
        if: matrix.abi == 'arm64-v8a'
        timeout-minutes: 8
        run: |
          set -o pipefail
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev xvfb
          python3 -u AndroidJV/test_browser.py --juce AndroidJV/deps/JUCE --generated AndroidJV/generated/virtualjv --out browser-test 2>&1 | tee browser-test.log
      - name: Android 16 ZIP and BIN document import (synthetic fixtures, no ROMs)
        if: matrix.abi == 'x86_64'
        timeout-minutes: 9
        run: |
          set -o pipefail
          python3 -u AndroidJV/test_import.py 2>&1 | tee import-test.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache-android
          key: rijv880-ndk28-juce8015-${{ matrix.abi }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics-${{ matrix.abi }}
          path: |
            audio-unit-tests.txt
            build-android.log
            browser-test.log
            browser-test/legacy-asan.txt
            browser-test/fixed-result.txt
            import-test.log
            previous-cert.txt
            current-cert.txt
            AndroidJV/generated/virtualjv/BROWSER-SAFETY-SCOPE.json
            AndroidJV/test-results/
          retention-days: 14
